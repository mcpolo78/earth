# Redéploie le site sur Vercel toutes les 6 heures pour récupérer le dernier run GFS
# (les données sont téléchargées pendant le build Vercel, voir vercel.json).
# Nécessite le secret VERCEL_DEPLOY_HOOK (URL d'un Deploy Hook Vercel) ; sans lui, le job ne fait rien.
name: Rafraîchir les données météo

on:
  schedule:
    - cron: "30 4,10,16,22 * * *"   # environ 4 h 30 après chaque run GFS (00/06/12/18 UTC)
  workflow_dispatch:

jobs:
  redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le Deploy Hook Vercel
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "Secret VERCEL_DEPLOY_HOOK absent, rien à faire."; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Redéploiement demandé."
